# Alert and recording rules for the made-up orders service in examples/orders.
groups:
  - name: orders
    rules:
      - record: route:http_request_duration_seconds:p99
        expr: histogram_quantile(0.99, sum by (route, le) (rate(http_request_duration_seconds_bucket[5m])))
      - alert: OrdersSlow
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{route="/orders/{id}"}[5m]))) > 0.25
        for: 10m
      - alert: OrdersBacklog
        expr: order_queue_depth > 100
        for: 15m
      - alert: CardDeclinesHigh
        expr: sum(rate(payment_errors_total{reason="card_declined"}[5m])) > 1
        for: 5m
      - alert: OrderErrors
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 5m
